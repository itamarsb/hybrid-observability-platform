global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

  external_labels:
    environment: local
    platform: hybrid-observability-platform

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9090

  - job_name: otel-collector-internal
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: application-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889
