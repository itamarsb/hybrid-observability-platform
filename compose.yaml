name: hybrid-observability-platform

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: hybrid-observability-api:local
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_ENVIRONMENT: development
      APP_LOG_LEVEL: INFO
      APP_SERVICE_VERSION: 0.1.0
      APP_MAXIMUM_SCENARIO_DELAY_MS: 5000
      APP_DEPENDENCY_TIMEOUT_SECONDS: 2.0

      OTEL_SERVICE_NAME: hybrid-observability-api
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: 1.0
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      otel-collector:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        fluentd-request-ack: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"
        tag: "docker.{{.Name}}"
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    restart: unless-stopped
    init: true
    read_only: true
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./observability/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:24224:24224/tcp"
      - "127.0.0.1:24224:24224/udp"
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=48h
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/promtool
        - check
        - ready
        - --url=http://localhost:9090
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    init: true
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M

  tempo:
    image: grafana/tempo:3.0.0
    restart: unless-stopped
    init: true
    command:
      - -config.file=/etc/tempo/config.yaml
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test:
        - CMD
        - /tempo
        - -health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    init: true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform-health.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M

networks:
  observability:
    name: hybrid-observability-network
    driver: bridge

volumes:
  prometheus-data:
    name: hybrid-observability-prometheus-data

  loki-data:
    name: hybrid-observability-loki-data

  tempo-data:
    name: hybrid-observability-tempo-data

  grafana-data:
    name: hybrid-observability-grafana-data
